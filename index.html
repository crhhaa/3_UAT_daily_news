<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
    <script type="module">
        import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
        window.renderPdfPage = async function(filename, pageNum) {
            const canvas = document.getElementById('pdf-canvas');
            if (!canvas) return;
            const container = canvas.parentElement;
            canvas.style.display = 'none';
            let loadingEl = container.querySelector('.pdf-loading');
            if (!loadingEl) {
                loadingEl = document.createElement('p');
                loadingEl.className = 'pdf-loading text-xs text-gray-400 text-center py-4';
                loadingEl.textContent = '載入中...';
                container.appendChild(loadingEl);
            }
            try {
                const pdf = await pdfjsLib.getDocument(`data/${filename}`).promise;
                const page = await pdf.getPage(pageNum);
                const scale = canvas.parentElement.offsetWidth / page.getViewport({ scale: 1 }).width;
                const viewport = page.getViewport({ scale: Math.max(scale, 1.5) });
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                loadingEl.remove();
                canvas.style.display = 'block';
            } catch (e) {
                loadingEl.textContent = '原始新聞載入失敗';
            }
        };
    </script>

        }

        /* Filter pills */

            padding: 4px 12px; border-radius: 999px;

        .filter-pill.active-type { background: #0d9488; color: white; border-color: #0d9488; }

        /* Mobile nav drawer */
        #mobileNavOverlay {
            position: fixed; inset: 0; z-index: 151;
            background: rgba(10,20,40,0.45); backdrop-filter: blur(3px);
            opacity: 0; pointer-events: none; transition: opacity 0.25s;
        }
        #mobileNavOverlay.open { opacity: 1; pointer-events: auto; }
        #mobileNavDrawer {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 152;
            background: white; border-radius: 20px 20px 0 0;
            max-height: 72vh; display: flex; flex-direction: column;

        .pdf-embed-container iframe { display: block; }

        mark { background: #fef08a; border-radius: 2px; padding: 0 2px; }
    </style>
</head>

<script>
// ---------------- CONFIG ----------------
const URL_ARTICLES = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS3jJajis01zdjURBnc3N8s8lWGLaKroD-C91JxYc0QS3UmySZ7ZX2pfvNSoLU0HHUwVOc7qa3D9nSB/pub?output=csv&gid=1398464012';
const URL_SUMMARY  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS3jJajis01zdjURBnc3N8s8lWGLaKroD-C91JxYc0QS3UmySZ7ZX2pfvNSoLU0HHUwVOc7qa3D9nSB/pub?output=csv&gid=1068875418';

// ---------------- CATEGORY COLORS ----------------
const CAT_COLORS = {
    '總體經濟': { dot: 'bg-blue-400',    badge: 'bg-blue-100 text-blue-800' },
    '股市行情': { dot: 'bg-emerald-400', badge: 'bg-emerald-100 text-emerald-800' },
    '競業動態': { dot: 'bg-purple-400',  badge: 'bg-purple-100 text-purple-800' },
    '元大新聞': { dot: 'bg-orange-400',  badge: 'bg-orange-100 text-orange-800' },
    '中國金融市場': { dot: 'bg-rose-400', badge: 'bg-rose-100 text-rose-800' },
    '法規監理': { dot: 'bg-teal-400',    badge: 'bg-teal-100 text-teal-800' },
};
const DEFAULT_COLORS = { dot: 'bg-gray-400', badge: 'bg-gray-100 text-gray-700' };

const GROUP_MAP = {
    '元大':['元大金控','元大銀行','元大投信','元大投顧','元大證券','元大期貨','元大人壽','元大創投','元大國際資產(AMC)','元大證金'],
    '國泰':['國泰金控','國泰人壽','國泰世華銀行','國泰投信','國泰證券'],
    '富邦':['富邦金控','台北富邦銀行','富邦人壽','富邦證券','富邦投信'],
    '中信':['中信金控','中國信託商業銀行','台灣人壽','中信證券','中信投信'],
    '玉山':['玉山金控','玉山銀行','玉山證券'],
    '永豐':['永豐金控','永豐銀行','永豐金證券'],
    '兆豐':['兆豐金控','兆豐銀行','兆豐證券','兆豐投信'],
    '第一':['第一金控','第一銀行','第一金證券','第一金投信'],
    '台新':['台新金控','台新銀行','台新人壽','台新證券','台新投信'],
    '合庫':['合庫金控','合作金庫銀行','合庫證券','合庫投信'],
    '華南':['華南金控','華南銀行','華南永昌證券'],
    '凱基':['開發金控','凱基銀行','凱基證券','凱基投信','凱基金控'],
};

// ---------------- STATE ----------------
let allArticles = [];
let allSummaries = [];
let filteredArticles = [];
let availableDates = [];
let currentDate = '';
let currentCat = 'ALL';
let currentGroup = 'ALL';
let currentType = 'ALL';
let currentSearch = '';
let selectedIndex = 0;

// ---------------- INIT ----------------
Promise.all([fetchCSV(URL_ARTICLES), fetchCSV(URL_SUMMARY)]).then(([artData, sumData]) => {
    allArticles = artData;
    allSummaries = sumData;

    availableDates = [...new Set(allArticles.map(a => a['日期']))].sort().reverse();

    const sel = document.getElementById('dateSelector');
    sel.innerHTML = '';
    availableDates.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = formatDateLabel(d);
        sel.appendChild(opt);
    });

    currentDate = availableDates[0] || '';
    applyFilters();
}).catch(err => {
    console.error('資料載入失敗', err);
    document.getElementById('articleDetail').innerHTML = `<div class="text-red-400 text-center py-16 text-sm">need to check google sheet URL<br>${err}</div>`;
});

document.getElementById('dateSelector').addEventListener('change', e => {
    currentDate = e.target.value;
    applyFilters();
});

// Filter pills
document.querySelectorAll('[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
        currentCat = btn.dataset.cat;
        document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active-cat'));
        btn.classList.add('active-cat');
        applyFilters();
    });
});
document.querySelectorAll('[data-group]').forEach(btn => {
    btn.addEventListener('click', () => {
        currentGroup = btn.dataset.group;
        document.querySelectorAll('[data-group]').forEach(b => b.classList.remove('active-group'));
        btn.classList.add('active-group');
        applyFilters();
    });
});
document.querySelectorAll('[data-type]').forEach(btn => {
    btn.addEventListener('click', () => {
        currentType = btn.dataset.type;
        document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active-type'));
        btn.classList.add('active-type');
        applyFilters();
    });
});

const searchInput = document.getElementById('searchInput');
const clearSearchBtn = document.getElementById('clearSearch');
searchInput.addEventListener('input', e => {
    currentSearch = e.target.value.trim();
    clearSearchBtn.classList.toggle('hidden', !currentSearch);
    applyFilters();
});
clearSearchBtn.addEventListener('click', () => {
    searchInput.value = '';
    currentSearch = '';
    clearSearchBtn.classList.add('hidden');
    applyFilters();
});

// ---------------- DATA LOADING ----------------
function fetchCSV(url) {
    return new Promise((resolve, reject) => {
        Papa.parse(url, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: r => resolve(r.data),
            error: e => reject(e),
        });
    });
}

// ---------------- FILTERS ----------------
function entityMatchesGroup(entitiesStr, groupKey) {
    if (!entitiesStr) return false;
    const members = GROUP_MAP[groupKey] || [];
    const entities = entitiesStr.split(',').map(s => s.trim());
    return entities.some(e => members.some(m => e.includes(m) || m.includes(e)));
}

function applyFilters() {
    const dayArticles = allArticles.filter(a => a['日期'] === currentDate);

    filteredArticles = dayArticles.filter(a => {
        if (currentCat !== 'ALL' && a['news_category'] !== currentCat) return false;
        if (currentGroup !== 'ALL' && !entityMatchesGroup(a['entities'], currentGroup)) return false;
        if (currentType !== 'ALL' && a['business_type'] !== currentType) return false;
        if (currentSearch) {
            const q = currentSearch.toLowerCase();
            const haystack = [a['title'], a['summary'], a['pm_insight'], a['entities'], a['yuanta_insight']]
                .join(' ').toLowerCase();
            if (!haystack.includes(q)) return false;
        }
        return true;
    });

    selectedIndex = 0;

    // Summary
    const sumRow = allSummaries.find(s => s['日期'] === currentDate);
    renderSummary(sumRow ? sumRow['executive_summary'] : '');

    // Hero subtitle
    const label = currentDate ? `${formatDateLabel(currentDate)}｜共 ${filteredArticles.length} 則` : '無資料';
    document.getElementById('heroSubtitle').textContent = label;

    // Result count if searching/filtering
    const isFiltered = currentCat !== 'ALL' || currentGroup !== 'ALL' || currentType !== 'ALL' || currentSearch;
    const rc = document.getElementById('resultCount');
    if (isFiltered && currentDate) {
        rc.classList.remove('hidden');
        rc.textContent = `篩選結果：共 ${filteredArticles.length} 則`;
    } else {
        rc.classList.add('hidden');
    }

    renderNav();
    renderDetail(selectedIndex);

    const mobileBtn = document.getElementById('mobileNavBtn');
    if (filteredArticles.length > 0) mobileBtn.classList.remove('hidden');
    else mobileBtn.classList.add('hidden');
    document.getElementById('mobileNavIndicator').textContent = filteredArticles.length;
}

// ---------------- SUMMARY ----------------
function renderSummary(text) {
    const ul = document.getElementById('summaryList');
    if (!text) {
        ul.innerHTML = '<li class="text-gray-400">今日尚無摘要資料。</li>';
        return;
    }
    const bullets = text.split('\n').filter(s => s.trim());
    ul.innerHTML = bullets.map(b =>
        `<li class="flex items-start gap-2"><span class="text-orange-500 font-bold mt-0.5 flex-shrink-0">•</span><span>${esc(b.trim())}</span></li>`
    ).join('');
}

// ---------------- NAV ----------------
function renderNav() {
    const count = filteredArticles.length;
    document.getElementById('articleNavCount').textContent = count > 0 ? `${count} 則` : '';

    const makeItems = (containerEl) => {
        containerEl.innerHTML = filteredArticles.length === 0
            ? '<p class="text-xs text-gray-400 text-center py-4">無符合條件的文章</p>'
            : filteredArticles.map((a, i) => {
                const cat = a['news_category'] || '';
                const colors = CAT_COLORS[cat] || DEFAULT_COLORS;
                const active = i === selectedIndex ? 'active' : '';
                return `<button class="news-nav-item ${active}" onclick="selectArticle(${i})">
                    <span class="nav-num">${i + 1}</span>
                    <span class="nav-cat-dot ${colors.dot}"></span>
                    <span class="nav-title">${esc(a['title'] || '（無標題）')}</span>
                </button>`;
            }).join('');
    };

    makeItems(document.getElementById('articleNavList'));
    makeItems(document.getElementById('mobileNavList'));
}

// ---------------- DETAIL ----------------
function renderDetail(idx) {
    const el = document.getElementById('articleDetail');
    if (filteredArticles.length === 0) {
        el.innerHTML = `<div class="text-gray-400 text-center py-20 text-sm">
            <p class="text-4xl mb-4">🔍</p>
            <p>沒有符合篩選條件的文章</p>
        </div>`;
        return;
    }
    const a = filteredArticles[idx];
    const cat = a['news_category'] || '';
    const colors = CAT_COLORS[cat] || DEFAULT_COLORS;

    const entitiesHtml = (a['entities'] || '').split(',').filter(s => s.trim()).map(e =>
        `<span class="inline-block px-2 py-0.5 rounded-full text-xs bg-indigo-100 text-indigo-700 font-medium">${esc(e.trim())}</span>`
    ).join(' ');

    const yuantaEntities = (a['yuanta_entities'] || '').split(',').filter(s => s.trim());
    const yuantaHtml = yuantaEntities.length > 0 ? `
        <div class="yuanta-block rounded-xl p-4 h-full">
            <div class="flex items-center gap-2 mb-2">
                <span class="text-base">🏢</span>
                <span class="text-sm font-bold text-blue-800">元大洞察</span>
                <div class="flex flex-wrap gap-1">
                    ${yuantaEntities.map(e => `<span class="text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-700 font-medium">${esc(e.trim())}</span>`).join('')}
                </div>
            </div>
            <p class="text-sm text-gray-700 leading-relaxed">${formatInsight(a['yuanta_insight'] || '')}</p>
        </div>` : '';

    const pmInsight = a['pm_insight'] || '';
    const pmHtml = pmInsight ? `
        <div class="insight-block rounded-xl p-4 h-full">
            <div class="flex items-center gap-2 mb-2">
                <span class="text-base">💡</span>
                <span class="text-sm font-bold text-orange-700">關鍵洞察</span>
            </div>
            <p class="text-sm text-gray-700 leading-relaxed">${formatInsight(pmInsight)}</p>
        </div>` : '';

    const hasPdf = !!(a['pdf_filename'] && a['page_number']);
    const pdfFilename = hasPdf ? a['pdf_filename'] : '';
    const pdfPageNum = hasPdf ? (parseInt(a['page_number']) || 1) : 1;
    const pdfEmbed = hasPdf ? `
        <div class="mt-6">
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">原文</p>
            <div class="pdf-embed-container">
                <canvas id="pdf-canvas" class="w-full" style="display:none;"></canvas>
            </div>
        </div>` : '';

    const navHtml = filteredArticles.length > 1 ? `
        <div class="flex items-center gap-2">
            ${idx > 0 ? `<button onclick="selectArticle(${idx-1})" class="flex items-center gap-1 px-3 py-1.5 rounded-lg border border-gray-200 text-sm text-gray-600 hover:bg-gray-50 transition-colors"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>上一則</button>` : ''}
            ${idx < filteredArticles.length - 1 ? `<button onclick="selectArticle(${idx+1})" class="flex items-center gap-1 px-3 py-1.5 rounded-lg border border-gray-200 text-sm text-gray-600 hover:bg-gray-50 transition-colors">下一則<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></button>` : ''}
        </div>` : '';


    const businessBadge = a['business_type'] ? `<span class="inline-block px-2 py-0.5 rounded-full text-xs bg-slate-100 text-slate-600 font-medium">${esc(a['business_type'])}</span>` : '';

    el.innerHTML = `
        <div class="flex flex-wrap items-start justify-between gap-3 mb-5">
            <div class="flex flex-wrap gap-1.5 items-center">
                <span class="inline-block px-2 py-0.5 rounded-full text-xs font-semibold ${colors.badge}">${esc(cat)}</span>
                ${businessBadge}
                <span class="text-xs text-gray-400">${esc(a['source_name'] || '')} · ${esc(a['publish_date'] || a['日期'] || '')}</span>
            </div>
            <div class="flex items-center gap-2">
                ${navHtml}
            </div>
        </div>

        <h2 class="text-xl sm:text-2xl font-bold text-gray-900 leading-snug mb-3">${highlightSearch(esc(a['title'] || '（無標題）'))}</h2>

        ${entitiesHtml ? `<div class="flex flex-wrap gap-1.5 mb-4">${entitiesHtml}</div>` : ''}

        <div class="bg-gray-50 rounded-xl p-4 mb-1">
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">新聞摘要</p>
            <p class="text-sm text-gray-700 leading-relaxed">${highlightSearch(esc(a['summary'] || '無摘要'))}</p>
        </div>

        ${(pmHtml || yuantaHtml) ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-4">${pmHtml}${yuantaHtml}</div>` : ''}
        ${pdfEmbed}
    `;

    if (hasPdf) {
        window.renderPdfPage(pdfFilename, pdfPageNum);
    }
}

function selectArticle(idx) {
    selectedIndex = idx;
    renderNav();
    renderDetail(idx);
    closeMobileNav();
    document.getElementById('articleDetail').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ---------------- MOBILE NAV ----------------
function openMobileNav() {
    document.getElementById('mobileNavOverlay').classList.add('open');
    document.getElementById('mobileNavDrawer').classList.add('open');
}
function closeMobileNav() {
    document.getElementById('mobileNavOverlay').classList.remove('open');
    document.getElementById('mobileNavDrawer').classList.remove('open');
}

// ---------------- HELPERS ----------------
function esc(str) {
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function highlightSearch(html) {
    if (!currentSearch) return html;
    const q = currentSearch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return html.replace(new RegExp(`(${q})`, 'gi'), '<mark>$1</mark>');
}

function formatInsight(text) {
    return esc(text)
        .replace(/。\*\*/g, '。<br>**')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/。([^\s。<]{1,12}[：:])/g, '。<br>$1')
        .replace(/\n/g, '<br>');
}

function formatDateLabel(dateStr) {
    if (!dateStr || dateStr.length < 8) return dateStr;
    const y = dateStr.slice(0,4), m = dateStr.slice(4,6), d = dateStr.slice(6,8);
    return `${y}/${m}/${d}`;
}
</script>
